<app-navbar (navigate)="setView($event)"></app-navbar>

<!-- VISTA PRINCIPAL (LANDING PAGE / INICIO) -->
<ng-container *ngIf="currentView === 'home'">
  <app-hero></app-hero>
  <app-about></app-about>
  <div class="pole-divider" role="presentation"></div>
  
  <!-- Solo los servicios en Inicio -->
  <app-services (navigateToSubscription)="setView($event)"></app-services>
  
  <app-team></app-team>
  <app-testimonials></app-testimonials>
  <app-cta-banner></app-cta-banner>
  <app-appointment></app-appointment>
  <div class="pole-divider" role="presentation"></div>
  <app-blog></app-blog>
</ng-container>

<!-- VISTA INDEPENDIENTE DE SUCURSALES -->
<ng-container *ngIf="currentView === 'sucursales'">
  <app-branch-register></app-branch-register>
</ng-container>

<!-- VISTA INDEPENDIENTE DE SERVICIOS / SUSCRIPCIÓN -->
<ng-container *ngIf="currentView === 'suscripcion'">
  <!-- Tarifas individuales de corte/barba -->
  <app-pricing (backToHome)="setView('home')"></app-pricing>
  <!-- Tarjetas de planes mensuales (Membresías) -->
  <app-subscription></app-subscription>
</ng-container>

<!-- FOOTER SIEMPRE AL FINAL -->
<app-footer></app-footer>
