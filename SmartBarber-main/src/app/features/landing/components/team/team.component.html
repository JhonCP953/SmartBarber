<section id="equipo" class="team-section">
  <div class="wrap">
    
    <!-- Encabezado con la navaja vintage -->
    <div class="team-head">
      <h2>Barberías Registradas</h2>
      <div class="team-divider">
        <span class="dash"></span>
        <svg class="razor-svg" viewBox="0 0 64 64" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 28 C 12 18, 30 14, 52 14 L 54 22 C 34 22, 20 26, 16 34 Z"/>
          <path d="M14 32 L 48 50 C 50 51, 52 50, 53 48 L 55 44 C 56 42, 55 40, 53 39 L 20 22 Z" opacity="0.85"/>
          <circle cx="16" cy="31" r="2.5" fill="#1a1a1a"/>
        </svg>
        <span class="dash"></span>
      </div>
    </div>

    <!-- Rejilla de barberías con overlay de hover -->
    <div class="team-grid">
      <div class="team-card" *ngFor="let shop of barbershops">
        <div class="card-image-wrapper">
          <img [src]="shop.image" [alt]="shop.name">
          <div class="hover-overlay">
            <h3 class="member-name">{{ shop.name }}</h3>
            <span class="member-role">{{ shop.location }}</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>
