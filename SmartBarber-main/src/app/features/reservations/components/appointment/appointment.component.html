<div class="booking-page-wrapper">
  <div class="booking-main-card">

    <!-- Encabezado -->
    <div class="booking-header">
      <span class="gauge-tag">MIS RESERVAS</span>
      <h2 class="title">Agendar Cita</h2>
      <p class="subtitle">Selecciona la sede, el barbero y tu horario ideal respetando su jornada de trabajo.</p>
    </div>

    <!-- Contenedor 2 Columnas -->
    <div class="booking-grid-columns">

      <!-- COLUMNA 1: Paso 1 - Barbería, barberos y servicios -->
      <div class="step-card">
        <div class="step-header">
          <h3> Seleccionar Barbería (Sede)</h3>
        </div>

        <app-barberia-selector
          [barberias]="barberias"
          [selectedId]="selectedBarberiaId"
          (barberiaChange)="onBarberiaChange($event)">
        </app-barberia-selector>

        <app-barbero-list
          [barberos]="barberosFiltrados"
          [selected]="selectedBarbero"
          (barberoSeleccionado)="onBarberoSelect($event)">
        </app-barbero-list>

        <app-servicio-list
          [servicios]="serviciosDisponibles"
          [selectedIds]="selectedServicesIds"
          [loading]="loadingServicios"
          (servicioToggle)="toggleServicio($event)">
        </app-servicio-list>
      </div>

      <!-- COLUMNA 2: Paso 2 - Calendario, horarios y confirmación -->
      <div class="step-card">
        <div class="step-header">
          <h3>Seleccionar Barbero y Hora </h3>
        </div>

        <app-calendario
          [currentDate]="currentDate"
          [selectedDia]="selectedDia"
          (cambioMes)="cambiarMes($event)"
          (diaSeleccionado)="seleccionarDia($event)">
        </app-calendario>

        <app-horarios-slots
          *ngIf="selectedBarbero"
          class="mt-3"
          [selectedFecha]="selectedFecha"
          [selectedHora]="selectedHora"
          [slots]="slotsHorarios"
          [loading]="loadingHorarios"
          [error]="errorHorario"
          (horaSeleccionada)="seleccionarHora($event)">
        </app-horarios-slots>

        <app-resumen-reserva
          [servicios]="serviciosSeleccionados"
          [total]="precioTotal"
          [duracion]="duracionTotal"
          [cargando]="isLoading"
          (confirmar)="crearReserva()">
        </app-resumen-reserva>
      </div>

    </div>
  </div>
</div>
