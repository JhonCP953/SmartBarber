<section class="feedback-section">
  <div class="wrap">
    <div class="feedback-card">
      <h2>DÉJANOS TU OPINIÓN</h2>
      <p>Cuéntanos cómo fue tu experiencia general en nuestra barbería y la calidad de los cortes.</p>

      <form [formGroup]="feedbackForm" (ngSubmit)="onSubmit()">
        <div class="form-grid">
          
          <!-- Nombre -->
          <div class="form-group">
            <input 
              type="text" 
              formControlName="name" 
              placeholder="Tu nombre" 
              class="form-control" 
            />
          </div>

          <!-- Correo -->
          <div class="form-group">
            <input 
              type="email" 
              formControlName="email" 
              placeholder="Tu correo electrónico" 
              class="form-control" 
            />
          </div>

          <!-- Selección (mantiene formControlName="barber" y el array original) -->
          <div class="form-group">
            <select formControlName="barber" class="form-control">
              <option value="" disabled selected>Selecciona el tipo de corte o servicio</option>
              <option *ngFor="let barbero of barberos" [value]="barbero">
                {{ barbero }}
              </option>
            </select>
          </div>

          <!-- Calificación de la Barbería / Servicio -->
          <div class="form-group">
            <select formControlName="rating" class="form-control">
              <option value="" disabled selected>Calificación general de la barbería</option>
              <option value="5">⭐⭐⭐⭐⭐ (Excelente)</option>
              <option value="4">⭐⭐⭐⭐ (Muy Bueno)</option>
              <option value="3">⭐⭐⭐ (Bueno)</option>
              <option value="2">⭐⭐ (Regular)</option>
              <option value="1">⭐ (Malo)</option>
            </select>
          </div>

          <!-- Comentario / Opinión -->
          <div class="form-group full-width">
            <textarea 
              formControlName="comment" 
              rows="4" 
              placeholder="Escribe tus comentarios sobre el ambiente del local y el resultado de los cortes..." 
              class="form-control">
            </textarea>
          </div>

        </div>

        <button 
          type="submit" 
          [disabled]="feedbackForm.invalid || state === 'sending'" 
          class="btn-submit">
          <span *ngIf="state === 'idle'">ENVIAR OPINIÓN</span>
          <span *ngIf="state === 'sending'">ENVIANDO...</span>
          <span *ngIf="state === 'success'">¡ENVIADO CON ÉXITO!</span>
          <span *ngIf="state === 'error'">ERROR AL ENVIAR</span>
        </button>
      </form>
    </div>

  </div>
</section>
