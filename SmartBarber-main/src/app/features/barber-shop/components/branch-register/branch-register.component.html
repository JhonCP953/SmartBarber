<section class="branch-section" id="sucursales">
  <div class="wrap">
    
    <!-- TARJETA PRINCIPAL CON DOS COLUMNAS -->
    <div class="auth-card">
      
      <!-- COLUMNA IZQUIERDA: BANNER -->
      <div class="auth-banner">
        <div class="banner-overlay">
          <span class="eyebrow">Expansión SmartBarber</span>
          <h3>SMARTBARBER</h3>
          <p>Gestión y expansión para tu red de barberías</p>
        </div>
      </div>

      <!-- COLUMNA DERECHA: PESTAÑAS Y FORMULARIOS -->
      <div class="auth-content">
        
        <div class="auth-header">
          <h2>Bienvenido</h2>
          
          <!-- PESTAÑAS DE NAVEGACIÓN -->
          <div class="auth-tabs">
            <button 
              type="button"
              class="tab-btn" 
              [class.active]="activeTab === 'login'" 
              (click)="switchTab('login')">
              Iniciar Sesión
            </button>
            <button 
              type="button"
              class="tab-btn" 
              [class.active]="activeTab === 'signup'" 
              (click)="switchTab('signup')">
              Registrar Barbería
            </button>
          </div>
        </div>

        <!-- FORMULARIO 1: INICIAR SESIÓN -->
        <form *ngIf="activeTab === 'login'" (ngSubmit)="onLogin()" class="branch-form">
          <div class="form-grid single-col">
            <div class="field">
              <label for="login-email">Correo Electrónico</label>
              <input 
                type="email" 
                id="login-email" 
                [(ngModel)]="loginData.email" 
                name="email" 
                placeholder="ejemplo@smartbarber.com" 
                required>
            </div>

            <div class="field">
              <label for="login-password">Contraseña</label>
              <input 
                type="password" 
                id="login-password" 
                [(ngModel)]="loginData.password" 
                name="password" 
                placeholder="••••••••" 
                required>
            </div>
          </div>

          <div class="form-actions flex-center">
            <button type="submit" class="btn btn-primary btn-save">Iniciar Sesión</button>
          </div>
        </form>

        <!-- FORMULARIO 2: REGISTRAR BARBERÍA -->
        <form *ngIf="activeTab === 'signup'" (ngSubmit)="onRegisterBranch()" class="branch-form">
          <div class="form-grid">
            
            <div class="field">
              <label for="nombre">Nombre de la Barbería</label>
              <input 
                type="text" 
                id="nombre" 
                [(ngModel)]="registerData.nombre" 
                name="nombre" 
                placeholder="Ej: Smart Barber 15" 
                required>
            </div>

            <div class="field">
              <label for="razonSocial">Razón Social</label>
              <input 
                type="text" 
                id="razonSocial" 
                [(ngModel)]="registerData.razonSocial" 
                name="razonSocial" 
                placeholder="Ej: Smart Barber S.A.S." 
                required>
            </div>

            <div class="field">
              <label for="tipoDocumento">Tipo de Documento</label>
              <select 
                id="tipoDocumento" 
                [(ngModel)]="registerData.tipoDocumento" 
                name="tipoDocumento" 
                required>
                <option value="NIT">NIT</option>
                <option value="CC">Cédula de Ciudadanía</option>
                <option value="CE">Cédula de Extranjería</option>
              </select>
            </div>

            <div class="field">
              <label for="documento">Número de Documento / NIT</label>
              <input 
                type="text" 
                id="documento" 
                [(ngModel)]="registerData.documento" 
                name="documento" 
                placeholder="Ej: 9012345" 
                required>
            </div>

            <div class="field">
              <label for="celular">Teléfono Celular</label>
              <input 
                type="tel" 
                id="celular" 
                [(ngModel)]="registerData.celular" 
                name="celular" 
                placeholder="Ej: 3001234567" 
                required>
            </div>

            <div class="field">
              <label for="ubicacion">Ubicación / Dirección</label>
              <input 
                type="text" 
                id="ubicacion" 
                [(ngModel)]="registerData.ubicacion" 
                name="ubicacion" 
                placeholder="Ej: Soacha, Cundinamarca" 
                required>
            </div>

            <div class="field full-width">
              <label for="descripcion">Descripción</label>
              <textarea 
                id="descripcion" 
                [(ngModel)]="registerData.descripcion" 
                name="descripcion" 
                rows="2"
                placeholder="Ej: Barbería especializada en cortes modernos y tradicionales" 
                required></textarea>
            </div>

          </div>

          <div class="form-actions flex-center">
            <button type="submit" class="btn btn-primary btn-save">Guardar Barbería</button>
          </div>
        </form>

      </div>
    </div>

    <!-- SECCIÓN DE BARBERÍAS ACTIVAS CON DISEÑO CIRCULAR -->
    <div class="branch-list" *ngIf="branches.length > 0">
      <div class="section-title-wrap">
        <h3>BARBERÍAS ACTIVAS ({{ branches.length }})</h3>
      </div>

      <div class="cards-grid-circular">
        <div class="branch-circle-card" *ngFor="let item of branches">
          
          <div class="circle-avatar">
            <img 
              src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?q=80&w=600&auto=format&fit=crop" 
              [alt]="item.nombre">
          </div>

          <div class="branch-circle-content">
            <h4>{{ item.nombre }}</h4>
            <p class="description">{{ item.descripcion }}</p>
            
            <div class="meta-info">
              <span>📍 {{ item.ubicacion }}</span>
              <span>📞 {{ item.celular }}</span>
              <span>🏢 {{ item.razonSocial }}</span>
              <span>📄 {{ item.tipoDocumento }}: {{ item.documento }}</span>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>
</section>
