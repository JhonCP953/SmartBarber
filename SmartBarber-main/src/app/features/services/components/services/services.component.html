<section id="servicios" class="services-showcase">
  <div class="wrap">

    <div class="showcase-head">
      <div class="eyebrow">Plataforma de Gestión Integral</div>
      <h2>SERVICIOS PARA TU BARBERÍA</h2>
      <div class="showcase-divider">
        <span class="dash"></span>
        <svg class="mustache-svg" viewBox="0 0 64 64" fill="currentColor">
          <path d="M12 28 C 12 18, 30 14, 52 14 L 54 22 C 34 22, 20 26, 16 34 Z" />
          <path d="M14 32 L 48 50 C 50 51, 52 50, 53 48 L 55 44 C 56 42, 55 40, 53 39 L 20 22 Z" opacity="0.85" />
          <circle cx="16" cy="31" r="2.5" fill="#1a1a1a" />
        </svg>
        <span class="dash"></span>
      </div>
    </div>

    <!-- CARDS DE SERVICIOS -->
    <div class="showcase-grid">
      <div class="showcase-card" *ngFor="let service of services">
        <svg class="showcase-icon" viewBox="0 0 64 64">
          <ng-container [ngSwitch]="service.icon">

            <!-- GESTIÓN DE CITAS -->
            <ng-container *ngSwitchCase="'calendar'">
              <rect x="12" y="16" width="40" height="36" rx="4" />
              <path d="M12 26 h40" />
              <path d="M22 10 v10" />
              <path d="M42 10 v10" />
              <circle cx="24" cy="36" r="1.5" />
              <circle cx="32" cy="36" r="1.5" />
              <circle cx="40" cy="36" r="1.5" />
              <circle cx="24" cy="44" r="1.5" />
              <circle cx="32" cy="44" r="1.5" />
            </ng-container>

            <!-- CONTROL DE EQUIPOS -->
            <ng-container *ngSwitchCase="'users'">
              <circle cx="24" cy="22" r="7" />
              <path d="M12 48 c0-8 6-12 12-12 s12 4 12 12" />
              <path d="M40 22 a5 5 0 1 0 0-10" />
              <path d="M34 38 c4-3 9-3 12 0 3 3 3 8 3 10" />
            </ng-container>

            <!-- CATÁLOGO DE SERVICIOS -->
            <ng-container *ngSwitchCase="'catalog'">
              <rect x="14" y="12" width="36" height="40" rx="3" />
              <path d="M22 22 h20" />
              <path d="M22 32 h20" />
              <path d="M22 42 h12" />
            </ng-container>

            <!-- MÉTRICAS DE NEGOCIO -->
            <ng-container *ngSwitchCase="'chart'">
              <path d="M12 50 h40" />
              <rect x="18" y="32" width="6" height="18" rx="1" />
              <rect x="29" y="22" width="6" height="28" rx="1" />
              <rect x="40" y="14" width="6" height="36" rx="1" />
              <path d="M16 28 l10-8 8 6 12-12" />
            </ng-container>

          </ng-container>
        </svg>
        <h3>{{ service.title }}</h3>
        <p>{{ service.description }}</p>
      </div>
    </div>

    <!-- BOTÓN QUE LLEVA A SUSCRIPCIÓN -->
    <div class="showcase-action">
      <a class="btn-services-plans" routerLink="/subscription">
        VER PLANES DE SUSCRIPCIÓN
      </a>
    </div>

  </div>
</section>
