<form
    [formGroup]="form"
    (ngSubmit)="submit()">

    <h2>Registrar barbero</h2>

    <label for="name">
        Nombre completo *
    </label>

    <input
        id="name"
        formControlName="name">

    <small
        *ngIf="
            form.controls.name.touched &&
            form.controls.name.invalid
        ">

        El nombre es obligatorio.

    </small>


    <label for="documentType">
        Tipo de documento *
    </label>

    <select
        id="documentType"
        formControlName="documentType">

        <option value="CC">
            Cédula de ciudadanía
        </option>

        <option value="CE">
            Cédula de extranjería
        </option>

    </select>


    <label for="document">
        Número de documento *
    </label>

    <input
        id="document"
        formControlName="document">

    <small
        *ngIf="
            form.controls.document.touched &&
            form.controls.document.invalid
        ">

        El documento es obligatorio.

    </small>


    <label for="email">
        Correo electrónico *
    </label>

    <input
        id="email"
        type="email"
        formControlName="email">


    <label for="cell">
        Celular *
    </label>

    <input
        id="cell"
        type="tel"
        maxlength="10"
        formControlName="cell">


    <fieldset>

        <legend>
            Especialidades *
        </legend>

        <label
            *ngFor="
                let specialty of specialties
            ">

            <input
                type="checkbox"
                [checked]="
                    selectedSpecialties.has(
                        specialty
                    )
                "
                (change)="
                    toggleSpecialty(
                        specialty,
                        $any($event.target).checked
                    )
                ">

            {{ specialty }}

        </label>

    </fieldset>

    <small
        *ngIf="
            selectedSpecialties.size === 0
        ">

        Selecciona al menos una especialidad.

    </small>


    <p
        *ngIf="backendError"
        role="alert">

        {{ backendError }}

    </p>


    <p
        *ngIf="successMessage"
        role="status">

        {{ successMessage }}

    </p>


    <button
        type="submit"
        [disabled]="isSubmitting">

        {{
            isSubmitting
                ? 'Registrando...'
                : 'Registrar barbero'
        }}

    </button>

</form>
