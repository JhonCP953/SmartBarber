<header>
  <div class="wrap nav-inner">

    <!-- Logo -->
    <div class="logo">
      <img src="/logo.png" alt="SmartBarber Logo" class="logo-icon-img" />

      <div class="logo-text">
        SMARTBARBER
        <span class="logo-sub">
          Barbería &amp; Salón desde 1992
        </span>
      </div>
    </div>

    <!-- Navegación principal -->
    <nav aria-label="Navegación principal">
      <ul>

        <li *ngFor="let link of links" [class.has-dropdown]="link.sublinks">

          <a [routerLink]="link.route" [fragment]="link.fragment" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: !link.fragment }" (click)="closeMenu()">
            {{ link.label }}

            <span *ngIf="link.sublinks" class="dropdown-arrow">
              ▾
            </span>
          </a>

          <!-- Submenú desplegable si existe -->
          <ul *ngIf="link.sublinks" class="dropdown-menu">
            <li *ngFor="let sub of link.sublinks">

              <a [routerLink]="sub.route" [fragment]="sub.fragment" (click)="closeMenu()">
                {{ sub.label }}
              </a>

            </li>
          </ul>

        </li>

      </ul>
    </nav>

   <!-- Botón CTA principal -->
   <!-- Contenedor de los dos botones separados -->
    <div class="auth-buttons-group">
      <a [routerLink]="['/auth/login']" class="btn nav-cta" (click)="closeMenu()">
        Inicio
      </a>
      <a [routerLink]="['/auth/register']" class="btn nav-cta" (click)="closeMenu()">
        Registro
      </a>
    </div>

    <!-- Botón Hamburguesa para Mobile -->
    <button class="menu-toggle" type="button" (click)="toggleMenu()" aria-label="Abrir menú">
      ☰
    </button>

  </div>

  <!-- Navegación Mobile -->
  <nav *ngIf="isMenuOpen" class="mobile-nav" aria-label="Navegación móvil">
    <ul>

      <ng-container *ngFor="let link of links">

        <li>
          <a [routerLink]="link.route" [fragment]="link.fragment" (click)="closeMenu()">
            {{ link.label }}
          </a>
        </li>

        <li *ngFor="let sub of link.sublinks" class="mobile-sublink">
          <a [routerLink]="sub.route" [fragment]="sub.fragment" (click)="closeMenu()">
            — {{ sub.label }}
          </a>
        </li>

      </ng-container>

    </ul>
  </nav>
</header>
